name: Web-to-APK Builder

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Enter the Website URL'
        required: true
        default: 'https://google.com'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # এটি মিসিং জার ফাইলটি অটোমেটিক ঠিক করবে
      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          wget https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar

      - name: Inject URL into MainActivity
        run: |
          if [ -f "MainActivity.java" ]; then
            sed -i "s|REPLACE_ME_URL|${{ github.event.inputs.website_url }}|g" MainActivity.java
          elif [ -f "app/src/main/java/com/takbir/myapp/MainActivity.java" ]; then
            sed -i "s|REPLACE_ME_URL|${{ github.event.inputs.website_url }}|g" app/src/main/java/com/takbir/myapp/MainActivity.java
          else
            echo "MainActivity.java not found!"
            exit 1
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Takbir-App-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
